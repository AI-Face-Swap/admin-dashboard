name: htut-ai-prod

services:
  php:
    image: ghcr.io/ai-face-swap/admin-dashboard:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:8080' # host nginx reverse-proxies to this
    environment:
      # serversideup image automations
      AUTORUN_ENABLED: 'true' # runs `php artisan migrate` on container start
      PHP_OPCACHE_ENABLE: '1'
      PHP_MEMORY_LIMIT: 512M
      PHP_UPLOAD_MAX_FILE_SIZE: 100M
      PHP_POST_MAX_SIZE: 100M
      NGINX_CLIENT_MAX_BODY_SIZE: 100M
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl --fail --silent http://localhost:8080/healthcheck || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue:
    image: ghcr.io/ai-face-swap/admin-dashboard:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ['php', 'artisan', 'queue:work', '--tries=3', '--timeout=600']
    env_file: .env.production
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f "queue:work" >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    image: ghcr.io/ai-face-swap/admin-dashboard:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ['php', 'artisan', 'schedule:work']
    env_file: .env.production
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f "schedule:work" >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mariadb:11
    restart: unless-stopped
    env_file: .env.production
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-htut-ai}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mysql_data:
  redis_data:
