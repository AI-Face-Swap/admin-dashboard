name: htut-ai

services:
  php:
    image: serversideup/php:8.4-fpm-nginx
    ports:
      - '${APP_PORT:-8080}:8080'
    volumes:
      - .:/var/www/html
    environment:
      # Laravel → Docker network (these real env vars override .env inside the container only)
      APP_URL: http://localhost:${APP_PORT:-8080}
      DB_HOST: mysql
      DB_PORT: '3306'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: '1025'
      # PHP / NGINX tuning (handled by the serversideup image)
      PHP_MEMORY_LIMIT: 512M
      PHP_UPLOAD_MAX_FILE_SIZE: 100M
      PHP_POST_MAX_SIZE: 100M
      NGINX_CLIENT_MAX_BODY_SIZE: 100M
      # OPcache disabled for local development
      PHP_OPCACHE_ENABLE: '0'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl --fail --silent http://localhost:8080/healthcheck || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  mysql:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-htut-ai}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - '${DB_HOST_PORT:-3307}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - '${REDIS_HOST_PORT:-6380}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 12

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '${MAILPIT_UI_PORT:-8025}:8025'
      - '${MAILPIT_SMTP_PORT:-1025}:1025'

  node:
    image: node:20-alpine
    working_dir: /var/www/html
    # Install dependencies only once — node_modules lives in a named volume,
    # so restarts reuse the existing install instead of re-running npm.
    # --no-save keeps package-lock.json managed by the host, not containers.
    command: sh -c '[ -d node_modules/vite ] || npm install --no-audit --no-fund --no-save; npm run dev'
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    ports:
      - '${VITE_HOST_PORT:-5174}:5174'
    environment:
      VITE_DEV_SERVER_PORT: '5174'
      # No PHP in this container: Wayfinder types are generated by the php
      # container (`make wayfinder`) into the shared bind mount.
      VITE_WAYFINDER_COMMAND: 'true'

volumes:
  mysql_data:
  redis_data:
  node_modules:
