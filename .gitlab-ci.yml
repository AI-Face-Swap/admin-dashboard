stages:
  - deploy

deploy_to_production:
  stage: deploy
  tags:
    - production
  script:
    - echo "==> 1. Updating HTUT AI Backend codebase..."
    - cd /var/www/htut-ai-backend
    - git config core.filemode false
    - git checkout main
    - git reset --hard HEAD
    - git clean -fd
    - git pull https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/nainghtethtun-group/htut-ai-backend.git main

    - echo "==> 2. Building Docker image..."
    - docker compose --env-file .env.production -f docker-compose.production.yml build php

    - echo "==> 3. Restarting production containers (migrations run automatically on container start)..."
    - docker compose --env-file .env.production -f docker-compose.production.yml up -d --remove-orphans

    - echo "==> 4. Cleaning stale images..."
    - docker image prune -f

    - echo "==> 5. Verifying application health..."
    - |
      for attempt in $(seq 1 30); do
        if curl --fail --silent --insecure --max-time 5 http://localhost:8088/up >/dev/null 2>&1; then
          echo "Health check passed on attempt ${attempt}!"
          break
        fi
        if [ "$attempt" -eq 30 ]; then
          echo "ERROR: Application health check failed after 90s."
          docker compose --env-file .env.production -f docker-compose.production.yml ps
          docker compose --env-file .env.production -f docker-compose.production.yml logs --tail=50 php
          exit 1
        fi
        echo "Waiting for container startup and migrations (attempt ${attempt}/30)..."
        sleep 3
      done

    - echo "==> HTUT AI Backend production deployment completed successfully!"

  rules:
    - if: $CI_COMMIT_BRANCH == "main"
