stages:
  - deploy

deploy_to_production:
  stage: deploy
  tags:
    - production
  script:
    - echo "==> 1. Updating HTUT AI Backend codebase..."
    - cd /var/www/htut-ai-backend
    - git config core.filemode false
    - git checkout main
    - git reset --hard HEAD
    - git clean -fd
    - git pull https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/nainghtethtun-group/htut-ai-backend.git main

    - export IMAGE_TAG="${CI_COMMIT_SHORT_SHA}"
    - export PREV_IMAGE_ID=$(docker image inspect htut-ai-backend:latest --format '{{.Id}}' 2>/dev/null || true)

    - echo "==> 2. Building Docker image (${IMAGE_TAG}) without touching running containers..."
    - docker compose --env-file .env.production -f docker-compose.production.yml build php

    - echo "==> 3. Running pre-flight database migrations before cutover..."
    - docker compose --env-file .env.production -f docker-compose.production.yml run --rm --no-deps -e AUTORUN_ENABLED=false php php artisan migrate --force

    - echo "==> 4. Swapping production containers..."
    - docker tag "htut-ai-backend:${IMAGE_TAG}" htut-ai-backend:latest
    - docker compose --env-file .env.production -f docker-compose.production.yml up -d --remove-orphans

    - echo "==> 5. Verifying application health (with auto-rollback on failure)..."
    - |
      HEALTH_OK=0
      for attempt in $(seq 1 30); do
        if curl --fail --silent --insecure --max-time 5 http://localhost:8088/up >/dev/null 2>&1; then
          echo "Health check passed on attempt ${attempt}!"
          HEALTH_OK=1
          break
        fi
        echo "Waiting for container startup (attempt ${attempt}/30)..."
        sleep 3
      done

      if [ "$HEALTH_OK" -ne 1 ]; then
        echo "ERROR: Health check failed after 90s."
        docker compose --env-file .env.production -f docker-compose.production.yml logs --tail=50 php
        if [ -n "$PREV_IMAGE_ID" ]; then
          echo "==> Rolling back to previous healthy image (${PREV_IMAGE_ID})..."
          docker tag "$PREV_IMAGE_ID" htut-ai-backend:latest
          IMAGE_TAG=latest docker compose --env-file .env.production -f docker-compose.production.yml up -d --remove-orphans
        fi
        exit 1
      fi

    - echo "==> 6. Cleaning stale images..."
    - docker image prune -f

    - echo "==> HTUT AI Backend production deployment completed successfully!"

  rules:
    - if: $CI_COMMIT_BRANCH == "main"
